model:
  model_id: qwen3
  trust_remote_code: True
  train_from_scratch: False
  init_model_with_meta_device: True

data:
  template: qwen3
  cutoff_len: 4096
  max_samples: 100000
  overwrite_cache: True
  preprocessing_num_workers: 1
  data_manager_type: mg

parallel:
  # BF16 gradient reduction lowers communication volume.
  reduce_dtype: bf16
  fsdp_modules:
    - model.layers.{*}
    - model.embed_tokens
    - lm_head
  recompute: True
  # Recompute attention only to balance memory usage and training throughput.
  recompute_modules:
    - model.layers.{*}.self_attn

training:
  stage: pt
  dataloader_num_workers: 4
  seed: 42
  dataloader_drop_last: True
  optimizer: adamw
  lr: 1e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.0
  min_lr: 1e-06
  num_train_epochs: 3.0
  max_steps: 5000
  save_steps: 500
  save_total_limit: 2
  logging_steps: 1

optimization:
  # Chunked loss calculation reduces peak memory from vocabulary logits.
  chunk_loss_size: 256
