model:
  model_id: ling_mini
  model_name_or_path: /path/to/Ling-mini-2.0
  tokenizer_name_or_path: /path/to/Ling-mini-2.0
  trust_remote_code: True
  train_from_scratch: False
  init_model_with_meta_device: True

data:
  dataset:
    file_name: /path/to/train.parquet
  template: empty
  cutoff_len: 4096
  max_samples: 100000
  overwrite_cache: False
  preprocessing_num_workers: 1
  data_manager_type: mg

parallel:
  fsdp_modules:
    - model.layers.{*}
    - model.word_embeddings
    - lm_head
  recompute: True
  recompute_modules:
    - model.layers.{*}
  param_dtype: bf16
  reduce_dtype: bf16
  ep_size: 1
  ep_fsdp_size: 1
  ep_modules:
    - model.layers.{*}.mlp.experts
  ep_dispatcher: eager
  num_to_forward_prefetch: 1
  num_to_backward_prefetch: 1

training:
  stage: pt
  dataloader_num_workers: 4
  seed: 42
  dataloader_drop_last: True
  optimizer: adamw
  lr: 1e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.01
  min_lr: 0.0
  num_train_epochs: 13
  max_steps: 5000
  save_steps: 0
  save_epochs: 0
  logging_steps: 1

optimization:
  chunk_loss_size: 512
  moe_grouped_gemm: True
  use_fused_rmsnorm: True
  use_fused_rotary_pos_emb: False
  use_flash_attn: False
